version: '3.8'

services:
  app:
    build: .
    container_name: techmarket-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=techmarket
      - DB_USER=techmarket
      - DB_PASSWORD=techmarket_password
      - JWT_SECRET=CBultGQ8fB/5wHIeA11EemoHtkYiWDnOmUAhZN971Bc=
      - JWT_EXPIRATION=86400000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tech-net

  postgres:
    image: postgres:16-alpine
    container_name: techmarket-postgres
    environment:
      - POSTGRES_DB=techmarket
      - POSTGRES_USER=techmarket
      - POSTGRES_PASSWORD=techmarket_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techmarket -d techmarket"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tech-net

volumes:
  postgres_data:

networks:
  tech-net:
    driver: bridge